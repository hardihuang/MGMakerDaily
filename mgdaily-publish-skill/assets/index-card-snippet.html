        <!-- News Card: {{TITLE}} ({{DATE_DISPLAY}}) -->
        <div class="card-link" data-category="{{CATEGORY_NAME}}" onclick="window.location='{{ARTICLE_FILENAME}}'">
            <article class="hand-drawn bg-white p-6 mb-6">
                <!-- Header: Category + Date -->
                <div class="mb-4">
                    {{CATEGORY_PILL_HTML}}
                    <div class="font-mono text-xs text-muted mt-2">{{DATE_DISPLAY}}</div>
                </div>

                <!-- Author -->
                <div class="font-mono text-xs text-muted mb-4">文章整理：{{AUTHOR}}</div>

                <h2 class="font-display font-bold text-2xl leading-tight mb-4">
                    {{TITLE}}
                </h2>

                <p class="text-muted leading-relaxed mb-6">
                    {{SUMMARY}}
                </p>

                <div class="thinking-box">
                    <div class="thinking-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4M12 8h.01"/>
                        </svg>
                        留给你的问题
                    </div>
                    <p class="thinking-question">
                        {{THINKING_QUESTION}}
                    </p>
                </div>

                <div class="links-row">
                    <span class="font-mono text-sm text-muted">阅读全文 →</span>
                    {{VIDEO_LINK_HTML}}
                </div>
            </article>
        </div>
